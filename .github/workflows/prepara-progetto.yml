name: Prepara la consegna FrigoTrack
on:
  push:
    paths:
      - '.github/workflows/prepara-progetto.yml'
permissions:
  contents: write
jobs:
  prepara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Estrai progetto dallo ZIP gia pubblicato
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path, PurePosixPath
          root=Path.cwd()
          with zipfile.ZipFile(root/'FrigoTrack.zip') as z:
              for item in z.infolist():
                  if item.is_dir() or not item.filename.startswith('FrigoTrack/'): continue
                  rel=PurePosixPath(item.filename).relative_to('FrigoTrack')
                  parts=rel.parts
                  if not parts or '..' in parts or parts[0]=='.vs': continue
                  if any(s in ('bin','obj') for s in parts) or item.filename.endswith(('.user','.suo')): continue
                  if len(parts)>=3 and parts[:2]==('Server','Schemas'):
                      parts=('Server','schemas')+parts[2:]
                  dest=root.joinpath(*parts)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(z.read(item))
          server=root/'Server'/'Server.csproj'
          project=server.read_text(encoding='utf-8-sig').replace('Schemas'+chr(92),'schemas'+chr(92))
          update='''  <ItemGroup>
              <Content Update="schemas/*.json">
                <CopyToOutputDirectory>PreserveNewest</CopyToOutputDirectory>
              </Content>
            </ItemGroup>

          '''
          if 'Content Update="schemas/' not in project:
              project=project.replace('</Project>',update+'</Project>')
          server.write_text(project,encoding='utf-8')
          client=root/'Client'/'Client.cs'
          source=client.read_text(encoding='utf-8-sig')
          anchor='// 3. PREPARAZIONE DEI SENSORI'
          if anchor not in source: raise SystemExit('Sezione dei sensori non trovata')
          if 'TEST BUSTA MANOMESSA' not in source:
              tests='''// TEST DEL MESSAGGIO CIFRATO MANOMESSO
          Console.WriteLine("\\nTEST BUSTA MANOMESSA");

          string misuraTestValida = JsonSerializer.Serialize(new
          {
              sensor_id = "CELLA-BG-007",
              timestamp = DateTimeOffset.UtcNow.ToString("O"),
              cargo_type = "pharma",
              temperature_c = 5.0,
              humidity = 55,
              battery = 87
          });

          var (testoValido, tagValido) = Cifratura.Cifra(misuraTestValida, K);

          // Cambia un byte del tag: il controllo di integrita deve fallire
          byte[] tagAlterato = Convert.FromBase64String(tagValido);
          tagAlterato[0] ^= 1;

          Busta bustaManomessa = new(
              session_id,
              testoValido,
              Convert.ToBase64String(tagAlterato)
          );

          HttpResponseMessage rispostaManomessa = await client.PostAsJsonAsync(
              indirizzoServer + "/api/telemetry",
              bustaManomessa
          );

          Console.WriteLine("HTTP " + (int)rispostaManomessa.StatusCode);
          Console.WriteLine(
              (int)rispostaManomessa.StatusCode == 400
              ? "TEST BUSTA MANOMESSA SUPERATO"
              : "TEST BUSTA MANOMESSA NON SUPERATO"
          );

          // TEST CON UNA SESSIONE MAI CREATA
          Console.WriteLine("\\nTEST SESSIONE INESISTENTE");

          Busta bustaSconosciuta = new(
              Guid.NewGuid().ToString(),
              testoValido,
              tagValido
          );

          HttpResponseMessage rispostaSconosciuta = await client.PostAsJsonAsync(
              indirizzoServer + "/api/telemetry",
              bustaSconosciuta
          );

          Console.WriteLine("HTTP " + (int)rispostaSconosciuta.StatusCode);
          Console.WriteLine(
              (int)rispostaSconosciuta.StatusCode == 401
              ? "TEST SESSIONE INESISTENTE SUPERATO"
              : "TEST SESSIONE INESISTENTE NON SUPERATO"
          );


          // ========================================
          '''
              where=source.index('// ========================================\n'+anchor)
              source=source[:where]+tests+source[where:]
              client.write_text(source,encoding='utf-8')
          readme=root/'README.md'
          if readme.exists():
              md=readme.read_text(encoding='utf-8-sig')
              md=md.replace('Program.cs', 'Server.cs')
              md=md.replace('Schemas e schemas', 'schemas')
              fence=chr(96)*3
              diagram=(fence+'mermaid\nsequenceDiagram\n    participant Client\n    participant Server\n    Client->>Server: Handshake con A\n    Server-->>Client: Sessione e B\n    Note over Client,Server: Calcolo del segreto condiviso\n    Client->>Server: Misura cifrata\n    Server-->>Client: Conferma cifrata\n    Client->>Server: Richiesta misure cifrata\n    Server-->>Client: Misure cifrate\n    Client->>Server: Chiusura cifrata\n    Server-->>Client: Conferma cifrata\n'+fence+'\n\n## Test e verifiche')
              md=md.replace(fence+'mermaid\n\n\n## Test e verifiche',diagram)
              md=md.replace('Restano da verificare separatamente il rifiuto di un messaggio cifrato manomesso e quello di una sessione mai creata.', 'Il Client include anche i test del messaggio cifrato manomesso (HTTP 400) e della sessione inesistente (HTTP 401).')
              readme.write_text(md,encoding='utf-8')
          (root/'.gitignore').write_text('.vs/\n**/bin/\n**/obj/\n*.user\n*.suo\n*.slnLaunch.user\n', encoding='utf-8')
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compila Client e Server
        run: |
          dotnet restore FrigoTrack.sln
          dotnet build FrigoTrack.sln --configuration Release --no-restore
      - name: Verifica i test reali
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project Server/Server.csproj --no-build --no-launch-profile -c Release >/tmp/servertest.log 2>&1 &
          serverpid=$!
          trap 'kill "$serverpid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/api/inesistente || true)" = "404" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/servertest.log; exit 1; fi
          printf '\n' | timeout 120 dotnet run --project Client/Client.csproj --no-build --no-launch-profile -c Release | tee /tmp/clienttest.log
          grep -Fq 'Handshake completato' /tmp/clienttest.log
          grep -Fq 'TEST MISURA NON VALIDA' /tmp/clienttest.log
          grep -Fq 'TEST SUPERATO' /tmp/clienttest.log
          grep -Fq 'TEST BUSTA MANOMESSA SUPERATO' /tmp/clienttest.log
          grep -Fq 'TEST SESSIONE INESISTENTE SUPERATO' /tmp/clienttest.log
          grep -Fq 'Sessione chiusa correttamente' /tmp/clienttest.log
          grep -Fq 'Test riuscito: sessione non più valida (HTTP 401)' /tmp/clienttest.log
          if grep -Fq 'NON SUPERATO' /tmp/clienttest.log; then exit 1; fi
      - name: Pubblica progetto completo sul repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch FrigoTrack.zip Client.cs Server.cs .github/workflows/prepara-progetto.yml
          git add -A
          git commit -m 'Organizza FrigoTrack e completa i test'
          git push origin HEAD:main
